
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Portal Login</title>
</head>
<body>
    <main>
        <h1>Welcome to Student Hub</h1>
        <p>Sign in to continue.</p>

        <form>
            <label>
                Email:
                <input type="email" name="email" required>
            </label>

            <br><br>

            <label>
                Password:
                <input type="password" name="password" required>
            </label>

            <br><br>

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
